[project]
name = "chakra-rag"
version = "0.1.0"
description = "RAG pipeline nhỏ: sqlite-vec + FTS5 + LangGraph agent, cho bài test AI Engineer"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-prebuilt",
    "sqlite-vec",
    "sentence-transformers",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "python-multipart",
    "pypdf",
    # Declared explicitly (previously only transitive / in requirements.txt):
    "openai",        # client SDK used indirectly by langchain-openai; pin visibility
    "pydantic>=2",   # models used by api layer
    "langsmith>=0.11.1,<1.0",  # direct SDK usage: Client/@traceable/ls.trace
    "cryptography>=50.0.1",
]

[tool.uv]
# Lockfile consistency: everything resolvable from pyproject alone.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core", "src/ingestion", "src/observability", "src/service", "src/storage"]
