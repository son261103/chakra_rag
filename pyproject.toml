[project]
name = "chakra-rag"
version = "0.1.0"
description = "RAG pipeline nhỏ: sqlite-vec + FTS5 + LangGraph agent, cho bài test AI Engineer"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "sqlite-vec",
    "sentence-transformers",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chakra_rag"]
