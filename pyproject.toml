[project]
name = "chakra-rag"
version = "0.1.0"
description = "RAG pipeline: PostgreSQL + pgvector + LangGraph agent"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-prebuilt",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "python-multipart",
    "pypdf",
    "sqlalchemy",
    "openai", 
    "pydantic",
    "langsmith",  
    "cryptography",
    "pgvector",
    "psycopg[binary]",
]

[tool.uv]
# Lockfile consistency: everything resolvable from pyproject alone.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api", "src/core", "src/ingestion", "src/observability", "src/repositories", "src/service", "src/storage"]
